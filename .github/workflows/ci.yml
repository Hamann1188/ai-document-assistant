name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docassist
          POSTGRES_PASSWORD: docassist
          POSTGRES_DB: docassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docassist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DOCASSIST_TEST_DATABASE_URL: postgresql+asyncpg://docassist:docassist@localhost:5432/docassist_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no floating major tag since v8)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest
        shell: bash  # -eo pipefail, so a failing pytest still fails the step
        run: |
          uv run pytest -rs | tee pytest.log
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
