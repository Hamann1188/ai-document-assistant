# --- Supplier agreement (EN) -------------------------------------------------------

- id: supplier-payment-terms
  kind: in_scope
  lang: en
  question: "When do we have to pay the supplier's invoices, and what if we pay late?"
  answer: "Within 15 banking days of the invoice date. Late payment: 0.1% of the unpaid amount per day, capped at 10%."
  evidence:
    - file: supplier-agreement.pdf
      page: 3
      quotes:
        - "within 15 banking days of the invoice date"
        - "0.1% of the unpaid amount for each day of delay"

- id: supplier-delivery
  kind: in_scope
  lang: en
  question: "What is the minimum order, and when is delivery free?"
  answer: "Minimum order 2,000,000 UZS. Delivery is free over 5,000,000 UZS; otherwise the fee is 60,000 UZS."
  evidence:
    - file: supplier-agreement.pdf
      page: 2
      quotes:
        - "The minimum order value is 2,000,000 UZS."
        - "Delivery is free of charge for orders over 5,000,000 UZS."

- id: supplier-termination
  kind: in_scope
  lang: en
  question: "How can we terminate the supply agreement?"
  answer: "With 60 days' written notice; immediately if the supplier misses delivery deadlines three times in one calendar quarter."
  evidence:
    - file: supplier-agreement.pdf
      page: 4
      quotes:
        - "Either party may terminate this agreement with 60 days' written notice."
        - "misses delivery deadlines three times in one calendar quarter"

