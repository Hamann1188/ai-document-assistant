services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docassist}
      POSTGRES_DB: ${POSTGRES_DB:-docassist}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DOCASSIST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docassist}:${POSTGRES_PASSWORD:-docassist}@db:5432/${POSTGRES_DB:-docassist}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
